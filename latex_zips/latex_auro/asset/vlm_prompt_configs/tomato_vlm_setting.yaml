server:
  endpoint: http://163.239.227.136:8000/v1/chat/completions
  timeout_seconds: 90

model:
  name: nvidia/Gemma-4-31B-IT-NVFP4
  temperature: 0.3
  max_completion_tokens: 256
  logprobs: true
  top_logprobs: 5
  enable_thinking: false
  include_reasoning: false

prompt:
  warmup_system: Answer using only Yes or No.
  warmup_user: Are you ready?
  environment_model: |-
    장면에는 각 stem마다 정확히 두 개의 토마토가 있습니다.
    stem_01에는 토마토 1번과 2번이 있고, stem_02에는 토마토 3번과 4번이 있습니다.
    토마토 번호는 반드시 장면의 오른쪽부터 왼쪽으로 1, 2, 3, 4 순서입니다. 가장 오른쪽이 1번이고 가장 왼쪽이 4번입니다.
    이 번호는 고정된 식별자입니다. 토마토가 가려지거나 집기, 수확 또는 폐기로 줄기에서 제거되어도 남은 토마토의 번호를 다시 매기지 않습니다.
  action_model: |-
    - navigate to <location>: 줄기 또는 도킹 위치로 이동합니다. 그리퍼가 비어 있어야 합니다. 현재 줄기에 딸 수 있는 토마토가 없으면, 다음 줄기로 이동합니다.
    - detect <stem>: 현재 로봇이 위치한 줄기의 토마토와 숙성 상태를 탐지합니다. 그리퍼가 비어 있어야 합니다. 새로 보이거나 아직 관측하지 않은 토마토는 집기 전에 반드시 탐지해야 합니다.
    - pick <tomato>: 현재 줄기에서 관측된 익은 토마토를 집습니다. 그리퍼가 비어 있어야 합니다.
    - scan <tomato>: 현재 로봇이 들고 있는 토마토가 신선한지 썩었는지 확인합니다.
    - place <tomato>: scan 결과 신선하다고 확인된 토마토만 수확 바구니에 넣습니다.
    - discard <tomato>: scan 결과 썩었다고 확인된 토마토만 폐기합니다.
    - done: 필요한 토마토를 모두 처리한 뒤에만 작업을 완료합니다.
    이미지에 토마토가 보인다는 사실만으로 로봇이 detect를 완료한 것은 아닙니다. 다른 토마토를 제거한 뒤 새 토마토가 드러났다면 pick보다 detect를 먼저 선택해야 합니다.
  fact_system: >-
    Answer the supplied Korean yes/no question from the two current RGB camera
    images and the supplied robot context. State the Yes/No answer first,
    followed by a concise reason in the requested format. Treat the current
    action only as context about what the robot is attempting; never use the
    current action itself as evidence that the queried hypothesis is true or
    false. Judge the hypothesis from visible evidence in the two images.
    The two ArUco markers on the right correspond to stem_01, and the two
    ArUco markers on the left correspond to stem_02.
    Use the fixed tomato numbering and stem assignments in the supplied
    environment model to identify tomatoes and stems. For freshness questions, a
    rotten tomato has a large rotten area on its lower side. Small scratches,
    dents, surface marks, highlights, or minor damage do not mean that the
    tomato is rotten. Answer that the tomato is not fresh only when the large
    rotten area is visibly present.
  fact_judgment_criteria:
    at: >-
      환경 모델의 고정된 토마토 번호와 줄기 배정에 따라 질문에 지정된
      토마토와 목표 줄기를 각각 식별합니다. 오른쪽의
      ArUco 마커 두 개가 있는 영역은 stem_01이고 왼쪽의 ArUco 마커 두 개가
      있는 영역은 stem_02입니다. 만약 화면에 ArUco 마커가 2개 밖에 없다면,
      로봇이 stem_02에 있다는 뜻입니다. 지정된 토마토가 목표 줄기 영역에 직접 보일
      때만 Yes로 판단합니다. 지정된 토마토가 반대쪽 줄기에 직접 보일 때만
      No로 판단합니다. 토마토가 가려졌거나 화면에 없거나 번호 식별이 불확실한
      경우, 단순히 보이지 않는다는 이유만으로 다른 줄기에 있다고 판단하지
      않습니다. 또한 stem_01에 있던 토마토를 집은 경우 그 토마토는 손에 있기에
      stem_01에 존재하지 않는 것으로 판단합니다. Current action에 적힌 
      줄기나 객체를 위치 증거로 사용하지 않습니다. 그리고 하나의 줄기에는 최대 2개의
      토마토만 존재할 수 있습니다. 
    ripe: >-
      지정된 토마토 자체를 먼저 식별합니다. 표면의 주된 색이 빨간색이면 익은
      것으로 판단합니다. 초록색이 주된 색이면 익지 않은 것으로 판단합니다.
      상처나 썩은 흔적은 숙도와 별개의 속성이므로 ripe 판단 근거로 사용하지
      않습니다.
    unripe: >-
      지정된 토마토 자체를 먼저 식별합니다. 표면의 주된 색이 초록색이면 아직
      익지 않은 것으로 판단하고, 빨간색이면 익은 것으로 판단합니다. 상처나
      썩은 흔적은 unripe 판단 근거로 사용하지 않습니다.
    fresh: >-
      현재 그리퍼가 실제로 들고 있는 지정 토마토의 표면을 확인합니다.
      크고 뚜렷한 베이지색의 썩은 영역이 보일 때만 No로
      판단합니다. 작은 상처, 눌림, 점, 반사광, 꼭지 주변의 사소한 변색은
      썩음이 아니므로 fresh를 부정하는 근거로 사용하지 않습니다.
      전체 이미지와 손목 이미지 둘을 근거로 판단합니다.
    rotten: >-
      현재 그리퍼가 실제로 들고 있는 지정 토마토의 표면을 확인합니다.
      크고 뚜렷한 베이지색의 썩은 영역이 보일 때만 No로
      판단합니다. 작은 상처, 눌림, 점, 반사광, 꼭지 주변의 사소한 변색은
      썩음이 아니므로 fresh를 부정하는 근거로 사용하지 않습니다.
      전체 이미지와 손목 이미지 둘을 근거로 판단합니다.
    holding: >-
      지정된 토마토가 로봇 그리퍼 안에 실제로 잡혀 있는지 확인합니다. 로봇이
      pick을 시도 중이라는 사실만으로 Yes라고 답하지 않습니다.
    holded: >-
      지정된 토마토가 로봇 그리퍼 안에 실제로 잡혀 있는지 확인합니다. 과거
      행동이나 Current action만으로 들고 있다고 판단하지 않습니다.
    handempty: >-
      두 이미지에서 그리퍼 내부에 토마토가 실제로 없는지 확인합니다. pick,
      place 또는 discard라는 Current action을 그리퍼 상태의 증거로 사용하지
      않습니다.
    loaded: >-
      지정된 토마토가 수확 바구니 안에 실제로 놓인 것이 보일 때만 Yes로
      판단합니다. place 행동을 시도했다는 사실만으로 수확 완료라고 판단하지
      않습니다.
    discarded: >-
      지정된 토마토가 폐기 위치에 실제로 놓인 것이 보일 때만 Yes로 판단합니다.
      discard 행동을 시도했다는 사실만으로 폐기 완료라고 판단하지 않습니다.
    observed: >-
      observed는 로봇이 탐지를 완료했는지를 뜻하는 절차적 상태입니다. 이미지에
      토마토가 보이는 것과 탐지 완료는 다릅니다. Current action이 detect라는
      이유만으로 Yes라고 답하지 않습니다.
    scanned: >-
      scanned는 들고 있는 토마토의 품질 검사가 완료됐는지를 뜻하는 절차적
      상태입니다. Current action이 scan이라는 이유만으로 Yes라고 답하지
      않습니다.
    located: >-
      로봇 본체가 목표 줄기의 ArUco 마커 영역 앞에 실제로 위치하는지 확인합니다.
      navigate Current action의 목적지를 현재 위치의 증거로 사용하지 않습니다.
    tomato_count: >-
      두 이미지에서 서로 다른 토마토를 중복 없이 셉니다. 가려진 영역을 임의로
      추정하지 않고, 두 카메라에서 같은 토마토를 두 번 세지 않습니다.
    tomato_harvested: >-
      수확 바구니 안에서 서로 다른 토마토를 중복 없이 셉니다. 과거 place 행동
      횟수를 수확된 토마토 수로 대신 사용하지 않습니다.
    tomato: >-
      지정된 물체의 형태와 색을 보고 실제 토마토인지 판단합니다.
    robot: >-
      지정된 대상이 현재 작업 로봇인지 외형으로 확인합니다.
    location: >-
      지정된 영역이 로봇이 이동할 수 있는 작업 위치인지 장면과 마커로 확인합니다.
    stem: >-
      지정된 영역이 토마토가 달린 줄기 영역인지 ArUco 마커와 식물 구조로 확인합니다.
    default: >-
      두 RGB 이미지에서 직접 확인되는 시각적 근거만 사용하고 Current action을
      가설의 참 또는 거짓을 증명하는 근거로 사용하지 않습니다.
  action_system: >-
    두 장의 현재 RGB 카메라 이미지와 제공된 로봇 상황을 사용하여 후보 중
    가장 적절한 다음 행동을 선택하세요. 지정된 형식에 따라 후보 토큰을 먼저
    쓰고, 그다음 한국어로 간결한 이유를 쓰세요. 후보 행동의 이름이나 현재
    행동을 그 행동이 실행 가능하다는 증거로 사용하지 말고, 이미지에서 확인되는
    로봇 위치, 그리퍼 상태, 토마토 위치와 외관을 기준으로 판단하세요.
  action_judgment_criteria:
    navigate: >-
      그리퍼가 비어 있고 목표 줄기로 이동할 필요가 있을 때 선택합니다. 이미
      목표 줄기 앞에 있거나 토마토를 들고 있으면 선택하지 않습니다.
    detect: >-
      그리퍼가 비어 있고 현재 줄기에 새로 드러났거나 아직 탐지하지 않은
      토마토가 있을 때 pick보다 먼저 선택합니다. 이미지에 bounding box가
      있다는 사실만으로 detect가 이미 완료됐다고 판단하지 않습니다.
    pick: >-
      그리퍼가 비어 있고 지정 토마토가 현재 로봇 줄기에 있으며 익은 상태로
      보일 때만 선택합니다. 지정 토마토가 가려졌거나 다른 줄기에 있거나 이미
      들고 있는 경우 선택하지 않습니다.
    scan: >-
      지정 토마토가 그리퍼에 실제로 잡혀 있고 품질을 아직 판단해야 할 때만
      선택합니다. 토마토를 들고 있지 않으면 선택하지 않습니다.
    place: >-
      그리퍼가 지정 토마토를 실제로 들고 있고, 아래쪽에 큰 썩은 영역이 보이지
      않아 신선하다고 판단될 때 선택합니다.
    discard: >-
      그리퍼가 지정 토마토를 실제로 들고 있고, 아래쪽에 크고 뚜렷한 썩은
      영역이 보일 때 선택합니다. 작은 상처만으로 폐기를 선택하지 않습니다.
    done: >-
      처리해야 할 익은 토마토가 남아 있지 않고 그리퍼도 비어 있을 때만
      선택합니다.
    noopt: >-
      구체적인 후보 행동들이 현재 이미지의 로봇 위치, 그리퍼 상태 또는 토마토
      상태와 맞지 않을 때 선택하여 사람이 직접 행동을 입력하게 합니다.
    default: >-
      이미지에서 행동의 대상과 실행 조건을 직접 확인할 수 있는 후보를 선택합니다.
