domain: rover
meta_data:
  description: simplified single-rover symbolic domain
  semantics: ASP-style state closure for known facts
  purpose: belief state initialization / possible world enumeration
  source: simplified from benchmarks/32_ROVER_IPC23 p001
  assumptions:
  - There is one rover, but rover(R) is kept as the agent type predicate.
  - The rover has the required store and sensing hardware by default.
  - The domain models soil sampling and simplified objective imaging.
  - Camera calibration, image modes, rock sampling, lander-channel, and store-selection predicates are omitted.

predicates:
- predicate: rover(R)
  meaning: R is the rover robot.

- predicate: waypoint(W)
  meaning: W is a navigation waypoint on the terrain.

- predicate: lander(L)
  meaning: L is the lander that receives rover data.

- predicate: objective(O)
  meaning: O is a science target that can be imaged.

- predicate: in(R,W)
  meaning: Rover R is currently at waypoint W.

- predicate: at_lander(L,W)
  meaning: Lander L is located at waypoint W.

- predicate: can_traverse(W1,W2)
  meaning: A rover can move directly from waypoint W1 to waypoint W2.

- predicate: visible(W1,W2)
  meaning: Waypoint W2 is visible from waypoint W1.

- predicate: visible_from(O,W)
  meaning: Objective O can be imaged from waypoint W.

- predicate: at_soil_sample(W)
  meaning: A soil sample is available at waypoint W.

- predicate: have_soil_analysis(R,W)
  meaning: Rover R has collected soil analysis data from waypoint W.

- predicate: have_image(R,O)
  meaning: Rover R has captured an image of objective O.
  
- predicate: communicated_soil_data(W)
  meaning: Soil data for waypoint W has been communicated.

- predicate: communicated_image_data(O)
  meaning: Image data for objective O has been communicated.

constraint: []

show:
- '#show rover/1'
- '#show waypoint/1'
- '#show lander/1'
- '#show objective/1'
- '#show in/2'
- '#show at_lander/2'
- '#show can_traverse/2'
- '#show visible/2'
- '#show visible_from/2'
- '#show at_soil_sample/1'
- '#show have_soil_analysis/2'
- '#show have_image/2'
- '#show communicated_soil_data/1'
- '#show communicated_image_data/1'
