domain: watering
meta_data:
  description: simplified partially observable watering domain
  semantics: ASP-style world generation under partial observability
  purpose: belief state initialization / possible world enumeration
  assumptions:
  - The room graph and tap location are known in every scene.
  - The basket location and plant locations are hidden initially.
  - find_basket and find_plant reveal candidate object locations through observations.
  - There are no numeric water, distance, or battery effects.
predicates:
- predicate: agent(A)
  meaning: A is the watering robot.
- predicate: plant(P)
  meaning: P is a plant that should be watered.
- predicate: container(C)
  meaning: C is a water container such as a basket.
- predicate: tap(T)
  meaning: T is the room containing the tap.
- predicate: room(R)
  meaning: R is a room or hallway location.
- predicate: holding(A,C)
  meaning: Agent A is holding container C.
- predicate: free(A)
  meaning: Agent A is not holding a container.
- predicate: at(I,R)
  meaning: Item or agent I is located in room R.
- predicate: connected(R1,R2)
  meaning: Room R1 is directly connected to room R2.
- predicate: water_loaded(C)
  meaning: Container C has water loaded from the tap.
- predicate: watered(P)
  meaning: Plant P has been watered.
choice_rules:
- choose: at(C,R)
  over:
  - room(R)
  given:
  - container(C)
  cardinality: 1..1
- choose: at(P,R)
  over:
  - room(R)
  given:
  - plant(P)
  cardinality: 1..1
constraint: []
show:
- '#show agent/1'
- '#show plant/1'
- '#show container/1'
- '#show tap/1'
- '#show room/1'
- '#show holding/2'
- '#show free/1'
- '#show at/2'
- '#show connected/2'
- '#show water_loaded/1'
- '#show watered/1'
