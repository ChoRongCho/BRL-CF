domain: watering
meta_data:
  description: simplified partially observable watering domain
  semantics: ASP-style world generation under partial observability
  purpose: belief state initialization / possible world enumeration
  assumptions:
  - The room graph and tap location are known in every scene.
  - Plant locations are hidden initially.
  - find_plant reveals candidate plant locations through observations.
  - The robot always carries its water container.
  - There are no numeric water, distance, or battery effects.
predicates:
- predicate: agent(A)
  meaning: A is the watering robot.
- predicate: plant(P)
  meaning: P is a plant that should be watered.
- predicate: tap(T)
  meaning: T is the room containing the tap.
- predicate: room(R)
  meaning: R is a room or hallway location.
- predicate: at(I,R)
  meaning: Item or agent I is located in room R.
- predicate: connected(R1,R2)
  meaning: Room R1 is directly connected to room R2.
- predicate: water_empty(A)
  meaning: Agent A's carried water container is empty.
- predicate: water_loaded(A)
  meaning: Agent A's carried water container is loaded with water.
- predicate: watered(P)
  meaning: Plant P has been watered.
- predicate: scanned(R)
  meaning: Room R has been searched for plants.
choice_rules:
- choose: at(P,R)
  over:
  - room(R)
  given:
  - plant(P)
  cardinality: 1..1
constraint: []
show:
- '#show agent/1'
- '#show plant/1'
- '#show tap/1'
- '#show room/1'
- '#show at/2'
- '#show connected/2'
- '#show water_empty/1'
- '#show water_loaded/1'
- '#show watered/1'
- '#show scanned/1'
